[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fitbatch"
version = "0.1.0b1"
description = "Bulk download & upload of your training data. For Garmin Connect."
readme = "README.md"
# python-garminconnect (planned email + password adapter) requires Python 3.12+.
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Dawid Medyński" }]
keywords = ["garmin", "garmin-connect", "fit", "training", "export", "import", "running", "cycling", "triathlon"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "flet[desktop]>=1.1,<2",
    "platformdirs>=4.3",
    # Pinned on purpose (N2): unofficial client, check releases and advisories before upgrading.
    "garminconnect==0.3.20",
    # Session storage outside Windows: macOS Keychain / Linux Secret Service (Windows uses DPAPI).
    "keyring>=25; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "build>=1.2",
    "twine>=6",
    "flet[cli]>=1.1,<2",
    "pyinstaller>=6.16,<7",   # 7.0 drops one-file macOS .app bundles, which flet pack builds
    "keyring>=25",   # tests of the macOS/Linux secret store run on Windows too
]

[project.urls]
Homepage = "https://fitbatch.app"
Repository = "https://github.com/dmconsultingit/fitbatch"
Issues = "https://github.com/dmconsultingit/fitbatch/issues"

[project.scripts]
fitbatch = "fitbatch.cli:main"

[project.gui-scripts]
fitbatch-gui = "fitbatch.ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fitbatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle (PEP 8)
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # modern Python syntax
    "B",        # likely bugs
    "SIM",      # simplifications
    "S",        # security (bandit)
    "ANN",      # type hints
]
ignore = [
    "ANN401",   # allow typing.Any where unavoidable
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]   # asserts and untyped fixtures are fine in tests
