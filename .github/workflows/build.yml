# Tests and builds the portable apps on every push; a "v*" tag also publishes a GitHub release.
# PyInstaller cannot cross-compile, so each system builds its own file.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: windows
          - name: macOS (Apple Silicon)
            os: macos-15
            artifact: macos-arm64
          - name: macOS (Intel)
            os: macos-15-intel
            artifact: macos-intel
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Test
        run: python -m pytest -q

      - name: Build Windows exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python packaging/patch_flet.py
          ./packaging/build_exe.ps1

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: bash packaging/build_macos.sh

      - name: Smoke test macOS app
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: dist/FitBatch.app/Contents/MacOS/FitBatch --version

      - uses: actions/upload-artifact@v5
        with:
          name: FitBatch-${{ matrix.artifact }}
          path: |
            dist/FitBatch.exe
            dist/FitBatch.exe.sha256
            dist/FitBatch-macOS-*.zip
            dist/FitBatch-macOS-*.zip.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --title "FitBatch ${TAG#v}" \
            --notes-file .github/release-notes.md \
            "${flags[@]}"
